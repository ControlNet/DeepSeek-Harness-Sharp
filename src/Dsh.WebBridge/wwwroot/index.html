<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsharp host</title>
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>dsharp host</h1>
    <p id="status" data-state="starting">Starting…</p>

    <form id="login" hidden>
      <label for="token">Web access token</label>
      <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button type="submit">Log in</button>
      <p class="hint">Run <code>dsharp host web --print-token</code> on the host to see the token.</p>
      <p id="login-error" class="error" hidden></p>
    </form>

    <section id="host" hidden>
      <h2>host.info</h2>
      <dl id="info"></dl>
      <pre id="raw"></pre>
    </section>
  </main>
</body>
</html>
