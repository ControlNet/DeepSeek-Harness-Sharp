# <<< generated

# MCP 服务器
mcp:
  filesystem:
    transport: stdio
    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem"]
    args: []
    url: null
    enabled: true

# 自动压缩选项
compaction:
  auto: true
  prune: true

# 日志
logging:
  # 最低级别:trace | debug | info | warn | error | off
  level: info
  # 内存缓冲条数(供 TUI 与启动失败聚合读取)
  buffer_size: 1000
  # 是否同时输出到控制台(TUI 下强制关闭)
  console: false
  # 写入 <home>/logs/dsh-YYYYMMDD.log
  file: true
  # 单文件上限(MB),超出后切分 .1/.2…
  file_max_mb: 32
  # 文件保留天数
  keep_days: 15

# 持久化根:留空用 $DSH_HOME 或 ~/.dsh;改动后下次启动后台把旧根的数据目录搬到新根
storage:
  # root: D:/dsh-data
  # 各分区目录: root之下的相对路径; 留空用同名默认目录(默认即下列值)
  # sessions: sessions
  # logs: logs
  # cache: cache
  # checkpoints: checkpoints
  # attachments: attachments
  # telemetry: telemetry.jsonl
  # run: run
  # dsharp storage paths 可打印解析结果;dsharp storage migrate --from <old> --to <new> 手动搬运
  tool_results:
    # 单个工具结果超过该字节数就落盘到 <root>/tool-results,会话里只留头尾与路径
    max_bytes: 65536
    # 落盘结果保留天数
    retain_days: 30

# 安全设置
safety:
  autoApprove: false
  blacklist: []
