name: diag-e2e
on:
  push:
    branches: [diag/e2e]
jobs:
  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: feed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact; else bash scripts/fetch-dryioc-feed.sh --use-gh-artifact; fi
      - run: dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo
      - run: dotnet build DeepSeek-Harness-Sharp/DeepSeek-Harness-Sharp.csproj -c Debug --nologo
      - name: sqlite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sqlite --no-progress -y
          $dll = Get-ChildItem 'C:\ProgramData\chocolatey\lib\sqlite' -Recurse -Filter 'sqlite3.dll' | Select-Object -First 1
          Copy-Item $dll.FullName 'tests/Dsh.Tests/bin/Debug/net10.0/' -Force
          Copy-Item $dll.FullName 'DeepSeek-Harness-Sharp/bin/Debug/net10.0/' -Force
      - name: pipe probe
        shell: bash
        run: |
          H="$PWD/.daemon-tests/probe"; mkdir -p "$H"; printf 'logging:\n  file: false\n' > "$H/settings.yaml"
          EXE=DeepSeek-Harness-Sharp/bin/Debug/net10.0/dsharp.exe
          start=$(date +%s); DSH_HOME="$H" timeout 90 "$EXE" session list | cat; echo "exit ${PIPESTATUS[0]} after $(( $(date +%s) - start ))s"
      - name: e2e
        shell: bash
        run: |
          EXE="tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests"; [ -x "$EXE" ] || EXE="$EXE.exe"
          ls /usr/sbin/sshd || true
          "$EXE" -noColor -parallel none -trait- "Category=LlmSmoke" -class Dsh.Tests.FleetLocalHostTests -class Dsh.Tests.FleetSshEndToEndTests -class Dsh.Tests.WebBridgeHubTests -class Dsh.Tests.WebBridgeSshTunnelTests -class Dsh.Tests.WebUiBrowserTests -class Dsh.Tests.WebBridgeTests -class Dsh.Tests.FleetConnectionTests -class Dsh.Tests.PtyHostTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webui-${{ matrix.os }}
          path: artifacts020/webui/*.png
      - name: leftovers
        if: always()
        shell: bash
        run: ps -ef | grep -i dsharp | grep -v grep || true
