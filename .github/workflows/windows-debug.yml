name: Windows 调试

# Manually started Windows worker for debugging any ref pushed to this fork.
# The workflow runs from the default branch and checks out the requested ref, so tested branches need no workflow changes.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要检出的分支、tag 或 SHA（须已推送到本仓库）'
        required: true
        default: master
      tests:
        description: 'Dsh.Tests 过滤参数，例如 -class Dsh.Tests.WindowsSandboxAuthorityTests；留空则只构建不跑测试'
        required: false
        default: ''
      tmate:
        description: '开启 tmate SSH 会话（仅限触发者 GitHub 账号上的 SSH key）'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows 调试（${{ inputs.ref }}）
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # Detached mode lets the build and tests run while the session is open; the action's post step waits for the session to end.
      - name: Open tmate SSH session
        id: tmate
        if: inputs.tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: true
          connect-timeout-seconds: 1800

      # Job logs are unreadable through the API until the job ends, but annotations of finished steps are readable.
      - name: Publish tmate connection as an annotation
        if: steps.tmate.outcome == 'success'
        shell: bash
        run: echo "::notice title=tmate::${{ steps.tmate.outputs.ssh-command }}"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: dotnet-cache-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Prepare local NuGet feed (packages/, DryIoc.dll)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install real C# frontends for standalone tool tests
        shell: pwsh
        run: |
          $tools = Join-Path $PWD '.artifacts/csharp-frontends'
          dotnet tool install dotnet-script --version 2.0.1 --tool-path $tools --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install csharprepl --version 0.9.2 --tool-path $tools --allow-roll-forward
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tools >> $env:GITHUB_PATH

      - name: Build tests (Debug, MSVC native compiler as in CI)
        id: build_tests
        run: dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo -p:DshNativeCompiler=cl

      - name: Start a standalone PTY daemon from the current build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .daemon-tests
          HOME_DIR="$(mktemp -d "$PWD/.daemon-tests/qXXXXXX")"
          cp src/Dsh.Boot/Profiles/Templates/settings.yaml "$HOME_DIR/settings.yaml"
          DSH_HOME="$(cygpath -w "$HOME_DIR")"
          export DSH_HOME
          echo "DSH_HOME=$DSH_HOME" >> "$GITHUB_ENV"
          "DeepSeek-Harness-Sharp/bin/Debug/net10.0/dsharp.exe" tui daemon > "$HOME_DIR/daemon.log" 2>&1 &
          DAEMON_PID=$!
          for _ in {1..200}; do
            if [ -e "$HOME_DIR/run/dsh.sock" ] || [ -e "$HOME_DIR/run/dsh.port" ]; then
              exit 0
            fi
            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              cat "$HOME_DIR/daemon.log"
              exit 1
            fi
            sleep 0.05
          done
          echo "::error::The standalone PTY daemon from the current build did not publish an endpoint"
          cat "$HOME_DIR/daemon.log"
          exit 1

      - name: Run selected tests
        if: ${{ !cancelled() && steps.build_tests.outcome == 'success' && inputs.tests != '' }}
        shell: bash
        timeout-minutes: 60
        env:
          TEST_FILTER: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          eval "FILTER=($TEST_FILTER)"
          tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests.exe -noColor -reporter verbose "${FILTER[@]}" \
            -trait- Category=GpuStress -trait- Category=OnlyGpu \
            -trait- Category=RenderBench -trait- Category=LlmSmoke
