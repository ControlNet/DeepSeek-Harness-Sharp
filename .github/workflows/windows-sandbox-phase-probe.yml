name: Windows sandbox startup phase probe

on:
  push:
    branches: [probe/native-phase-33]

permissions:
  contents: read

concurrency:
  group: native-phase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Original Windows sandbox consumers with numeric phase markers
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare the original local NuGet feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & ./scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the original test graph with phase-only observation
        run: >
          dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo
          -m:1 -nodeReuse:false -p:UseSharedCompilation=false -p:DshNativeCompiler=cl
      - name: Native directory and filesystem authority component gates
        shell: bash
        run: |
          set -euo pipefail
          tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests.exe -noColor -parallelMode none -reporter verbose \
            -class Dsh.Tests.WindowsDirectoryCollectorTests -class Dsh.Tests.WindowsSandboxAuthorityTests \
            -trait- Category=GpuStress -trait- Category=OnlyGpu \
            -trait- Category=RenderBench -trait- Category=LlmSmoke -failSkips
      - name: Original owned MCP consumer with its original deadline
        shell: bash
        run: |
          set -euo pipefail
          tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests.exe -noColor -parallelMode none -reporter verbose \
            -method Dsh.Tests.Mcp.McpSettingsBoundaryTests.OwnedStdio_PreservesToolOutput_ButNeverMutatesSettings \
            -trait- Category=GpuStress -trait- Category=OnlyGpu \
            -trait- Category=RenderBench -trait- Category=LlmSmoke -failSkips
