name: Windows native ETL tools and installed WPA export probe

on:
  push:
    branches: [probe/native-etl-tools-52]

permissions:
  contents: read

concurrency:
  group: native-etl-tools-52-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect installed command-line analyzer help without recording or exporting
        shell: pwsh
        run: ./.github/diagnostics/Invoke-NativeEtlToolsInventory.ps1
      - name: Export an owned four-second trace with the exact inspected installed WPA profile
        shell: pwsh
        # The entrypoint reuses the bounded inventory and refuses recording without both prerequisites.
        # Output shape observations are not event-schema validation or original MCP attribution.
        run: ./.github/diagnostics/Invoke-WpaInstalledProfileExport.ps1
