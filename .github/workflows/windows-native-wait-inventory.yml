name: Windows real WPA owned-thread raw-row probe

on:
  push:
    branches: [probe/native-etl-tools-52]

permissions:
  contents: read

concurrency:
  group: native-etl-tools-52-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate the private raw-row view with the real owned-thread capture
        shell: pwsh
        run: ./.github/diagnostics/Invoke-WpaInstalledProfileExport.ps1
