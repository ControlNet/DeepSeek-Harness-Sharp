name: Windows native ETL analyzer prerequisite inventory

on:
  push:
    branches: [probe/native-etl-tools-52]

permissions:
  contents: read

concurrency:
  group: native-etl-tools-52-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: windows-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect installed command-line analyzer help without recording or exporting
        shell: pwsh
        run: ./.github/diagnostics/Invoke-NativeEtlToolsInventory.ps1
      - name: Inspect installed WPA profile templates without recording or exporting
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./.github/diagnostics/Invoke-WpaInstalledProfileInventory.ps1
