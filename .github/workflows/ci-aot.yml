name: AOT publish validation

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      rid:
        required: true
        type: string
      native-cc:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.entry }} (${{ inputs.rid }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        entry: [cli, gui, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Download native iroh-ssh built in this run
        uses: actions/download-artifact@v4
        with:
          name: iroh-ssh-${{ inputs.os }}
          path: artifacts

      - name: Extract native component without a consumer cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/iroh-ssh | Out-Null
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -xf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare local NuGet feed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: Install AOT toolchain on Linux
        if: inputs.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: Publish NativeAOT entry
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          ENTRY='${{ matrix.entry }}'
          if [ "$ENTRY" = "cli" ]; then
            PROJECT="DeepSeek-Harness-Sharp/DeepSeek-Harness-Sharp.csproj"
            PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          elif [ "$ENTRY" = "gui" ]; then
            PROJECT="DshGuiHost/DshGuiHost.csproj"
            PUB="DshGuiHost/bin/Release/net10.0/$RID/publish"
          else
            PROJECT="Dsh.WebHost/Dsh.WebHost.csproj"
            PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          fi
          NATIVE_ARGS=(-p:DshNativeCompiler='${{ inputs.native-cc }}' -p:DshShipFaultProbe=true)
          dotnet publish "$PROJECT" \
            -c Release -r "$RID" -p:PublishAot=true --self-contained true \
            -p:DebugSymbols=false -p:DebugType=none "${NATIVE_ARGS[@]}" \
            --nologo -v m
          test -d "$PUB"
          test ! -d "artifacts/iroh-ssh/$RID/target"
          test ! -f "artifacts/iroh-ssh/$RID/source.tar.gz"
          FILE=iroh-ssh
          if [ "$RUNNER_OS" = "Windows" ]; then FILE=iroh-ssh.exe; fi
          "$PUB/tools/$FILE" version
          test -s "$PUB/tools/iroh-ssh.LICENSE.txt"
          test -s "$PUB/tools/iroh-ssh.THIRD-PARTY-LICENSES.txt"
          test -s "$PUB/tools/iroh-ssh.NOTICE.txt"
          cmp "artifacts/iroh-ssh/$RID/$FILE" "$PUB/tools/$FILE"
          cmp "artifacts/iroh-ssh/$RID/LICENSE.txt" "$PUB/tools/iroh-ssh.LICENSE.txt"
          cmp "artifacts/iroh-ssh/$RID/THIRD-PARTY-LICENSES.txt" "$PUB/tools/iroh-ssh.THIRD-PARTY-LICENSES.txt"
          cmp src/Dsh.Fleet.Client/iroh-ssh.NOTICE.txt "$PUB/tools/iroh-ssh.NOTICE.txt"
          cmp scripts/iroh-ssh-readiness.patch "$PUB/tools/iroh-ssh.READINESS.patch"
          rm -f "$PUB"/*.pdb "$PUB"/*.dbg
          mkdir -p artifacts
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          # Archive the complete publish root before artifact upload changes Unix modes.
          "$TAR" -cf "artifacts/aot-$RID-$ENTRY.tar" -C "$PUB" .

      - uses: actions/upload-artifact@v4
        with:
          name: aot-publish-${{ inputs.rid }}-${{ matrix.entry }}
          path: artifacts/aot-${{ inputs.rid }}-${{ matrix.entry }}.tar
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble and validate AOT (${{ inputs.rid }})
    needs: publish
    runs-on: ${{ inputs.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Download native iroh-ssh built in this run
        uses: actions/download-artifact@v4
        with:
          name: iroh-ssh-${{ inputs.os }}
          path: artifacts

      - name: Extract native component without a consumer cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/iroh-ssh | Out-Null
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -xf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare local NuGet feed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: Install AOT toolchain on Linux
        if: inputs.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - uses: actions/download-artifact@v4
        with:
          name: aot-publish-${{ inputs.rid }}-cli
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: aot-publish-${{ inputs.rid }}-gui
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: aot-publish-${{ inputs.rid }}-web
          path: artifacts

      - name: Assemble, assert NativeAOT output, and smoke test
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="DshGuiHost/bin/Release/net10.0/$RID/publish"
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          mkdir -p "$PUB" "$GUI_PUB" "$WEB_PUB"
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          "$TAR" -xf "artifacts/aot-$RID-cli.tar" -C "$PUB"
          "$TAR" -xf "artifacts/aot-$RID-gui.tar" -C "$GUI_PUB"
          "$TAR" -xf "artifacts/aot-$RID-web.tar" -C "$WEB_PUB"
          test ! -d "artifacts/iroh-ssh/$RID/target"
          test ! -f "artifacts/iroh-ssh/$RID/source.tar.gz"
          FILE=iroh-ssh
          if [ "$RUNNER_OS" = "Windows" ]; then FILE=iroh-ssh.exe; fi
          for OUTPUT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            "$OUTPUT/tools/$FILE" version
            test -s "$OUTPUT/tools/iroh-ssh.LICENSE.txt"
            test -s "$OUTPUT/tools/iroh-ssh.THIRD-PARTY-LICENSES.txt"
            test -s "$OUTPUT/tools/iroh-ssh.NOTICE.txt"
            cmp "artifacts/iroh-ssh/$RID/$FILE" "$OUTPUT/tools/$FILE"
            cmp "artifacts/iroh-ssh/$RID/LICENSE.txt" "$OUTPUT/tools/iroh-ssh.LICENSE.txt"
            cmp "artifacts/iroh-ssh/$RID/THIRD-PARTY-LICENSES.txt" "$OUTPUT/tools/iroh-ssh.THIRD-PARTY-LICENSES.txt"
            cmp src/Dsh.Fleet.Client/iroh-ssh.NOTICE.txt "$OUTPUT/tools/iroh-ssh.NOTICE.txt"
            cmp scripts/iroh-ssh-readiness.patch "$OUTPUT/tools/iroh-ssh.READINESS.patch"
          done
          bash scripts/assert-aot-output.sh "$WEB_PUB" dsharp-web
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "$WEB_PUB" \
            -TuiPublishDir "$PUB" \
            -GuiPublishDir "$GUI_PUB"
          # Overlay the GUI publish tree onto the CLI publish tree, as in the original job.
          cp -R "$GUI_PUB"/. "$PUB"/
          rm -f "$PUB"/dsh-gui*.pdb "$PUB"/dsh-gui*.dbg
          bash scripts/assert-aot-output.sh "$PUB"
          for NATIVE in dsh_plugin_guard dsh_fault_probe; do
            printf '%s\n' "$PUB"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$" || { echo "::error::AOT output is missing $NATIVE"; exit 1; }
          done
          rm -f "$PUB"/*.pdb "$PUB"/*.dbg
          mkdir -p "$PUB/plugins"
          EXE="$PUB/dsharp"
          if [ ! -f "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          chmod +x "$EXE" 2>/dev/null || true
          if command -v timeout >/dev/null 2>&1; then
            timeout 120 "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          else
            "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          fi || {
            echo "::error::AOT smoke test failed"
            tail -20 "$RUNNER_TEMP/aot-smoke.out"
            exit 1
          }
          echo "AOT smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: aot-${{ inputs.rid }}
          path: DeepSeek-Harness-Sharp/bin/Release/net10.0/${{ inputs.rid }}/publish
          if-no-files-found: error
          retention-days: 7

      - name: Regress published guard and probe, including Linux AOT plugin ABI
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          BIN="tests/Dsh.Tests/bin/Debug/net10.0"
          CLASSES=(-class Dsh.Tests.NativeGuardTests)
          # The test project restores the generator required by the native sample on a fresh runner.
          dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo -v m -p:DshNativeCompiler='${{ inputs.native-cc }}'
          if [ "$RID" = "linux-x64" ]; then
            dotnet publish tests/Dsh.NativePluginSample -c Release --nologo -v m
            CLASSES+=(-class Dsh.Tests.NativePluginAbiTests)
          fi
          test ! -d "artifacts/iroh-ssh/$RID/target"
          test ! -f "artifacts/iroh-ssh/$RID/source.tar.gz"
          # Run the real JIT test host with the guard and probe from the assembled release.
          for NATIVE in dsh_plugin_guard dsh_fault_probe; do
            FILE="$(printf '%s\n' "$PUB"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$")"
            FILE="${FILE##*/}"
            cp "$PUB/$FILE" "$BIN/$FILE"
            cmp "$PUB/$FILE" "$BIN/$FILE"
            echo "Regression uses AOT output: $PUB/$FILE"
          done
          EXE="$BIN/Dsh.Tests"
          if [ ! -x "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          "$EXE" -noColor "${CLASSES[@]}" -failSkips
