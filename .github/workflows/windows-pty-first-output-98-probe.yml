name: Original Windows full quick first-output observation 98

on:
  push:
    branches:
      - diag/pty-first-output98

permissions:
  contents: read

jobs:
  bridge-dryioc-feed:
    name: Bridge the exact formal run DryIoc feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify the frozen source artifact provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $response = & gh api -X GET 'repos/forestbat/DeepSeek-Harness-Sharp/actions/runs/42001413454/artifacts?name=dryioc-feed&per_page=100' 2>&1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the exact formal run artifact metadata.' }
          $metadata = ($response -join [Environment]::NewLine) | ConvertFrom-Json
          $artifacts = @($metadata.artifacts | Where-Object { $_.name -ceq 'dryioc-feed' })
          if ($metadata.total_count -ne 1 -or $artifacts.Count -ne 1) { throw 'Expected exactly one source dryioc-feed artifact.' }
          $artifact = $artifacts[0]
          if ($artifact.id -ne 13402188512 -or $artifact.expired -or $artifact.workflow_run.id -ne 42001413454 -or $artifact.digest -cne 'sha256:c50574452a0d86ff851f8963f6047eccc81153facf31c53be6ddf07452d81502') {
            throw 'The source artifact does not match the frozen formal run provenance.'
          }
          Write-Host 'SOURCE_FEED repository=forestbat/DeepSeek-Harness-Sharp run=42001413454 artifact=13402188512 digest=sha256:c50574452a0d86ff851f8963f6047eccc81153facf31c53be6ddf07452d81502'

      - name: Download the unchanged formal run feed
        uses: actions/download-artifact@v4
        with:
          name: dryioc-feed
          repository: forestbat/DeepSeek-Harness-Sharp
          run-id: 42001413454
          github-token: ${{ github.token }}
          path: packages

      - name: Verify the real package and commit before bridging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath packages -File -Recurse)
          $packages = @($files | Where-Object { $_.Name -clike 'DryIoc.dll.*.nupkg' })
          if ($files.Count -ne 3 -or $packages.Count -ne 1) { throw 'Expected the original package, commit stamp, and verifier only.' }
          $package = $packages[0]
          $commit = (Get-Content -LiteralPath "$($package.FullName).commit" -Raw).Trim()
          $sha256 = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($commit -cne 'b98d2ab37cf05bdea02c34e5e4f8e481d76d5d3f' -or $sha256 -cne 'd6a7a8be85937061a60f803b8f0d0fb9a2e320ea42185da5fc5166ad825c54a1') {
            throw 'The source DryIoc package does not match the frozen commit and SHA256.'
          }
          if (-not (Test-Path -LiteralPath packages/fetch-dryioc-feed.ps1 -PathType Leaf)) { throw 'The original feed verifier is missing.' }
          Write-Host "VERIFIED_SOURCE_PACKAGE commit=$commit sha256=$sha256"

      - name: Publish the verified unchanged feed into this run
        uses: actions/upload-artifact@v4
        with:
          name: dryioc-feed
          path: packages/
          if-no-files-found: error
          retention-days: 7

  iroh-component-windows:
    name: Prepare the real Iroh fixture（${{ matrix.rid }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0
      - name: Verify the checkout contains the current PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" HEAD
      - name: Cache the pinned-source iroh-ssh
        id: iroh-cache
        uses: actions/cache@v4
        with:
          path: artifacts/iroh-ssh-component.tar
          key: iroh-ssh-test-tar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-iroh-ssh.*', 'scripts/iroh-ssh-readiness.patch', 'scripts/iroh-ssh.NOTICE.txt') }}
      - name: Extract the cached native component
        if: steps.iroh-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/iroh-ssh | Out-Null
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -xf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Cold native compilation happens once per platform, outside consumer budgets.
      - name: Build the pinned-source native component
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-iroh-ssh.ps1 -Rid "${{ matrix.rid }}"
          else
            bash scripts/fetch-iroh-ssh.sh "${{ matrix.rid }}"
          fi
      - name: Archive the native component preserving executable permissions
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $files = @(Get-ChildItem -LiteralPath "artifacts/iroh-ssh/$rid" -File |
            Where-Object { $_.Name -notin @('source.tar.gz', '.acquire.lock') } |
            ForEach-Object { "$rid/$($_.Name)" })
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -cf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: iroh-ssh-${{ matrix.os }}
          path: artifacts/iroh-ssh-component.tar
          if-no-files-found: error
          retention-days: 7

  original-windows-quick:
    name: Original full quick with bounded first-output counters
    needs: [bridge-dryioc-feed, iroh-component-windows]
    uses: ./.github/workflows/ci-tests.yml
    with:
      os: windows-latest
      native-cc: cl
      native-cc-alt: clang-cl
      suite: quick
      quick-cohort: all
      dryioc-commit: b98d2ab37cf05bdea02c34e5e4f8e481d76d5d3f
      dryioc-sha256: d6a7a8be85937061a60f803b8f0d0fb9a2e320ea42185da5fc5166ad825c54a1
