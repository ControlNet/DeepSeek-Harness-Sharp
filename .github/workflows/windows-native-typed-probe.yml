name: Windows active-cutoff and pending-read file IO calibration

on:
  push:
    branches: [probe/native-file-identity-74]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-typed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build only standalone readers with application-local native SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path (Get-Location).Path '.artifacts/typed-packages'
          $config = Join-Path (Get-Location).Path '.artifacts/typed-nuget.config'
          $null = New-Item -ItemType Directory -Path (Split-Path $config) -Force
          [IO.File]::WriteAllText($config, '<configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>')
          foreach ($kind in @('Cpu', 'File')) {
            $project = ".github/diagnostics/Trace${kind}Reader/Trace${kind}Reader.csproj"
            $output = ".artifacts/typed-$($kind.ToLowerInvariant())"
            dotnet build $project -c Release -o $output -m:1 -p:BuildInParallel=false -p:ImportDirectoryBuildProps=false -p:ImportDirectoryBuildTargets=false -p:DebugType=None -p:DebugSymbols=false -p:EnableSourceControlManagerQueries=false -p:EnableSourceLink=false "-p:RestoreConfigFile=$config" "-p:RestorePackagesPath=$packages"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Serial active-thread and synchronous pending-read cutoffs
        shell: pwsh
        run: |
          $cpu = Join-Path (Get-Location).Path '.artifacts/typed-cpu/TraceCpuReader.exe'
          $file = Join-Path (Get-Location).Path '.artifacts/typed-file/TraceFileReader.exe'
          $failed = $false
          foreach ($mode in @('Active', 'PendingRead')) {
            $protocol = if ($mode -eq 'PendingRead') { 3 } else { 2 }
            Write-Host "NATIVE_TYPED_MODE protocol=$protocol begin=1"
            & ./.github/diagnostics/Invoke-TypedNativeCapture.ps1 -CpuReader $cpu -FileReader $file -BoundaryMode $mode
            $code = $LASTEXITCODE
            Write-Host "NATIVE_TYPED_MODE protocol=$protocol complete=1 exit=$code"
            if ($code -ne 0) { $failed = $true }
          }
          exit ([int]$failed)
