name: Product NativeAOT validation

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      rid:
        required: true
        type: string
      test_build_artifact:
        description: 'The same exact-source per-OS test build used by the test consumers'
        required: true
        type: string
      dryioc-commit:
        required: true
        type: string
      dryioc-sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate product entries (${{ inputs.rid }})
    runs-on: ${{ inputs.os }}
    # The caller joins only this OS's three publishers and shared test build.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check PR merge checkout contains the current head
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR_HEAD_SHA" HEAD

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Prepare Python for the test build archive
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the DryIoc feed prepared for this run
        uses: actions/download-artifact@v4
        with:
          name: dryioc-feed
          path: packages

      - name: Prepare local NuGet feed
        shell: pwsh
        run: |
          & ./packages/fetch-dryioc-feed.ps1 -VerifyOnly -ExpectedCommit '${{ inputs.dryioc-commit }}' -ExpectedSha256 '${{ inputs.dryioc-sha256 }}' -RefreshPackageCache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install AOT toolchain on Linux
        if: inputs.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev build-essential

      - name: Download the complete exact-source test build
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.test_build_artifact }}
          path: .ci-test-build

      - name: Restore and verify the complete exact-source test build
        shell: bash
        run: >
          python3 -B scripts/archive-test-build.py restore
          --archive .ci-test-build/test-build.tar.gz
          --source '${{ github.sha }}' --os '${{ runner.os }}'

      - name: Download this run's complete publish archives
        uses: actions/download-artifact@v4
        with:
          pattern: aot-intermediate-${{ inputs.rid }}-*
          merge-multiple: true
          path: artifacts

      - name: Restore the three publish roots and cold native plugin fixture
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          for ENTRY in cli gui web; do
            case "$ENTRY" in
              cli) PROJECT="DeepSeek-Harness-Sharp" ;;
              gui) PROJECT="Dsh.GuiHost" ;;
              web) PROJECT="Dsh.WebHost" ;;
            esac
            ROOT="$PROJECT/bin/Release/net10.0/$RID/publish"
            mkdir -p "$ROOT"
            "$TAR" -xf "artifacts/aot-$RID-$ENTRY.tar" -C "$ROOT"
          done
          if [ "$RID" = "linux-x64" ]; then
            SAMPLE="tests/Dsh.NativePluginSample/bin/Release/net10.0/linux-x64/publish"
            mkdir -p "$SAMPLE"
            "$TAR" -xf "artifacts/native-plugin-$RID.tar" -C "$SAMPLE"
            test -f "$SAMPLE/Dsh.NativePluginSample.so"
          fi

      - name: Assert NativeAOT output and smoke test the product's three entries
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="Dsh.GuiHost/bin/Release/net10.0/$RID/publish"
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          for OUTPUT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            if find "$OUTPUT" -type f \( -name iroh-ssh -o -name iroh-ssh.exe \) -print -quit | grep -q .; then
              echo "::error::NativeAOT products must not bundle the optional native Iroh command"
              exit 1
            fi
          done
          bash scripts/assert-aot-output.sh "$PUB"
          bash scripts/assert-aot-output.sh "$GUI_PUB" dsh-gui
          bash scripts/assert-aot-output.sh "$WEB_PUB" dsharp-web
          for ROOT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            for NATIVE in dsh_plugin_guard dsh_fault_probe; do
              printf '%s\n' "$ROOT"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$" || { echo "::error::AOT output is missing $NATIVE in $ROOT"; exit 1; }
            done
          done
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "$WEB_PUB" \
            -TuiPublishDir "$PUB" \
            -GuiPublishDir "$GUI_PUB"
          mkdir -p "$PUB/plugins"
          EXE="$PUB/dsharp"
          if [ ! -f "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          if command -v timeout >/dev/null 2>&1; then
            timeout 120 "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          else
            "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          fi || {
            echo "::error::AOT smoke test failed"
            tail -20 "$RUNNER_TEMP/aot-smoke.out"
            exit 1
          }
          echo "AOT smoke test passed"

      - name: Regress published guard and probe, including Linux AOT plugin ABI
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          BIN="tests/Dsh.Tests/bin/Debug/net10.0"
          CLASSES=(-class Dsh.Tests.NativeGuardTests)
          if [ "$RID" = "linux-x64" ]; then
            CLASSES+=(-class Dsh.Tests.NativePluginAbiTests)
          fi
          # DshNativeCompiler selects only guard/probe C outputs, replaced here by the actual published release.
          for NATIVE in dsh_plugin_guard dsh_fault_probe; do
            FILE="$(printf '%s\n' "$PUB"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$")"
            FILE="${FILE##*/}"
            cp "$PUB/$FILE" "$BIN/$FILE"
            cmp "$PUB/$FILE" "$BIN/$FILE"
            echo "Regression uses AOT output: $PUB/$FILE"
          done
          EXE="$BIN/Dsh.Tests"
          if [ ! -x "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          "$EXE" -noColor "${CLASSES[@]}"

      - name: Archive the product's three complete publish roots
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="Dsh.GuiHost/bin/Release/net10.0/$RID/publish"
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          for ROOT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            test -d "$ROOT"
            rm -f "$ROOT"/*.pdb "$ROOT"/*.dbg
          done
          mkdir -p artifacts
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          # Archive each complete entry root before artifact upload changes Unix modes.
          "$TAR" -cf "artifacts/aot-$RID-cli.tar" -C "$PUB" .
          "$TAR" -cf "artifacts/aot-$RID-gui.tar" -C "$GUI_PUB" .
          "$TAR" -cf "artifacts/aot-$RID-web.tar" -C "$WEB_PUB" .

      - uses: actions/upload-artifact@v4
        with:
          name: aot-${{ inputs.rid }}
          path: artifacts/aot-${{ inputs.rid }}-*.tar
          if-no-files-found: error
          retention-days: 7
