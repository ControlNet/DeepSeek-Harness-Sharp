name: 构建校验

# Keep a lightweight result for every push/PR so skipped heavy jobs do not leave required checks pending.
# Merges are checked by the master push event rather than a second pull_request.closed run.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      aot:
        description: '同时构建 AOT 档（Windows + Linux）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: 判定受影响校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      suites: ${{ steps.select.outputs.suites }}
      jit: ${{ steps.select.outputs.jit }}
      aot: ${{ steps.select.outputs.aot }}
      validate: ${{ steps.select.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 根据变更选择作业
        id: select
        shell: bash
        run: >
          python3 scripts/select-ci.py
          --event '${{ github.event_name }}'
          --base '${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          --head '${{ github.sha }}'
          --aot '${{ inputs.aot == true }}'
          --output "$GITHUB_OUTPUT"

  validate:
    name: 工作流与选测规则校验
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.12
      - name: 验证变更选择边界
        run: python3 -m unittest discover -s tests/ci -v

  test:
    name: 测试（${{ matrix.platform.os }}，${{ matrix.suite }}）
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            native-cc: cl
            native-cc-alt: clang-cl
          - os: ubuntu-latest
            native-cc: clang
            native-cc-alt: ''
          - os: macos-latest
            native-cc: clang
            native-cc-alt: ''
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
        exclude:
          - platform:
              os: windows-latest
              native-cc: cl
              native-cc-alt: clang-cl
            suite: raw
    uses: ./.github/workflows/ci-tests.yml
    with:
      os: ${{ matrix.platform.os }}
      native-cc: ${{ matrix.platform.native-cc }}
      native-cc-alt: ${{ matrix.platform.native-cc-alt }}
      suite: ${{ matrix.suite }}

  build:
    name: 发布校验（${{ matrix.os }}，${{ matrix.project }}，JIT）
    needs: changes
    if: needs.changes.outputs.jit == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        project: [DeepSeek-Harness-Sharp, DshGuiHost]
        include:
          - os: windows-latest
            rid: win-x64
            native-cc: cl
          - os: ubuntu-latest
            rid: linux-x64
            native-cc: clang
          - os: macos-latest
            rid: osx-arm64
            native-cc: clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: 准备本地 NuGet feed（packages/，DryIoc.dll）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi
      - name: JIT 发布校验（Release + 裁剪 + 自包含）
        run: >
          dotnet publish ${{ matrix.project }}/${{ matrix.project }}.csproj
          -c Release -r ${{ matrix.rid }}
          -p:DebugSymbols=false -p:DebugType=none
          -p:DshNativeCompiler=${{ matrix.native-cc }}
          --nologo -v m
      - name: 校验发布产物含原生故障遏制库
        shell: bash
        run: |
          set -euo pipefail
          PUB="${{ matrix.project }}/bin/Release/net10.0/${{ matrix.rid }}/publish"
          printf '%s\n' "$PUB"/* | grep -E '/(lib)?dsh_plugin_guard\.(dll|so|dylib)$' || { echo "::error::发布产物缺少 dsh_plugin_guard"; exit 1; }
      - name: GUI 主线程冒烟（macOS）
        if: runner.os == 'macOS' && matrix.project == 'DshGuiHost'
        shell: bash
        run: |
          set -euo pipefail
          PUB="DshGuiHost/bin/Release/net10.0/${{ matrix.rid }}/publish"
          EXE="$PUB/dsh-gui"
          test -f "$EXE" || { echo "::error::找不到 $EXE"; exit 1; }
          chmod +x "$EXE"
          DSH_HOME="$(mktemp -d)" "$EXE" > gui-smoke.out 2>&1 &
          GUIPID=$!
          ( sleep 30; kill -9 "$GUIPID" 2>/dev/null ) &
          WATCH=$!
          set +e
          wait "$GUIPID"
          kill "$WATCH" 2>/dev/null || true
          set -e
          cat gui-smoke.out || true
          if grep -q "IDispatcherImpl belongs to a different thread" gui-smoke.out; then
            echo "::error::macOS GUI 仍在子线程初始化 Avalonia"
            exit 1
          fi
          echo "macOS GUI 冒烟通过（未见 Dispatcher 主线程异常）"

  aot:
    name: AOT 构建（${{ matrix.rid }}）
    needs: changes
    if: needs.changes.outputs.aot == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            native-cc: cl
          - os: ubuntu-latest
            rid: linux-x64
            native-cc: clang
    uses: ./.github/workflows/ci-aot.yml
    with:
      os: ${{ matrix.os }}
      rid: ${{ matrix.rid }}
      native-cc: ${{ matrix.native-cc }}

  result:
    name: CI 结果
    needs: [changes, validate, test, build, aot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总必需校验结果
        shell: bash
        run: |
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            echo '::error::受影响的 CI 校验失败或被取消'
            exit 1
          fi
          echo '受影响的 CI 校验全部通过；不相关的校验已跳过'
